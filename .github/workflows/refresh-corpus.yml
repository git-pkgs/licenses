name: Refresh corpus

on:
  schedule:
    - cron: "37 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the latest ScanCode corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aboutcode-org/scancode-toolkit
          ref: develop
          path: .scancode
          persist-credentials: false
          sparse-checkout: |
            pyproject-licensedcode-data.toml
            src/licensedcode/data/licenses
            src/licensedcode/data/rules
            tests/licensedcode/data/datadriven/lic1
            tests/licensedcode/data/datadriven/lic2
            tests/licensedcode/data/datadriven/lic3
            tests/licensedcode/data/datadriven/lic4

      - name: Read upstream corpus version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git -C .scancode rev-parse HEAD)"
          version="$(ruby -e 'match = File.read(ARGV.fetch(0)).match(/^version = "([^"]+)"$/); abort "missing version" unless match; puts match[1]' .scancode/pyproject-licensedcode-data.toml)"
          pinned_commit="$(sed -n 's/^commit=//p' CORPUS_VERSION)"

          [[ "$commit" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]
          [[ "$pinned_commit" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]

          commit="$(printf '%s' "$commit" | tr 'A-F' 'a-f')"
          pinned_commit="$(printf '%s' "$pinned_commit" | tr 'A-F' 'a-f')"

          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ "$commit" == "$pinned_commit" ]]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'version=%s\ncommit=%s\n' "$version" "$commit" > CORPUS_VERSION
          COMMIT="$commit" ruby -pi -e 'sub(/^Pinned source commit: .+$/, "Pinned source commit: " + ENV.fetch("COMMIT"))' NOTICE
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Snapshot checked-in corpus
        if: steps.upstream.outputs.changed == 'true'
        run: |
          cp internal/corpus/corpus.bin.gz "$RUNNER_TEMP/previous-corpus.bin.gz"
          cp testdata/scancode_conformance_exact.json "$RUNNER_TEMP/previous-conformance.json"

      - name: Benchmark checked-in corpus
        if: steps.upstream.outputs.changed == 'true'
        run: |
          GOMAXPROCS=1 go test . \
            -run '^$' \
            -bench '^BenchmarkMatcherColdStart$' \
            -benchmem \
            -benchtime 1x \
            -count 5 \
            > "$RUNNER_TEMP/previous-benchmarks.txt"
          GOMAXPROCS=1 go test . \
            -run '^$' \
            -bench '^(BenchmarkMatcherNewWarm|BenchmarkMatchCorpusHash)$' \
            -benchmem \
            -benchtime 1s \
            -count 5 \
            >> "$RUNNER_TEMP/previous-benchmarks.txt"

      - name: Regenerate corpus
        if: steps.upstream.outputs.changed == 'true'
        run: |
          go run ./cmd/corpusgen \
            -scancode .scancode \
            -version-file CORPUS_VERSION \
            -output internal/corpus/corpus.bin.gz
          ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' internal/corpus/corpus.bin.gz > CORPUS_SHA256

      - name: Update conformance baseline
        if: steps.upstream.outputs.changed == 'true'
        env:
          SCANCODE_TESTDATA: .scancode/tests/licensedcode/data
          UPDATE_CONFORMANCE: "1"
        run: go test . -run '^TestScanCodeConformanceExact$' -v

      - name: Test
        if: steps.upstream.outputs.changed == 'true'
        run: go test ./...

      - name: Check exact conformance baseline
        if: steps.upstream.outputs.changed == 'true'
        env:
          SCANCODE_TESTDATA: .scancode/tests/licensedcode/data
        run: go test . -run '^TestScanCodeConformanceExact$' -v

      - name: Check deterministic rebuild
        if: steps.upstream.outputs.changed == 'true'
        run: >
          go run ./cmd/corpusgen
          -scancode .scancode
          -version-file CORPUS_VERSION
          -output "$RUNNER_TEMP/rebuilt-corpus.bin.gz"

      - name: Benchmark regenerated corpus
        if: steps.upstream.outputs.changed == 'true'
        run: |
          GOMAXPROCS=1 go test . \
            -run '^$' \
            -bench '^BenchmarkMatcherColdStart$' \
            -benchmem \
            -benchtime 1x \
            -count 5 \
            > "$RUNNER_TEMP/benchmarks.txt"
          GOMAXPROCS=1 go test . \
            -run '^$' \
            -bench '^(BenchmarkMatcherNewWarm|BenchmarkMatchCorpusHash)$' \
            -benchmem \
            -benchtime 1s \
            -count 5 \
            >> "$RUNNER_TEMP/benchmarks.txt"

      - name: Generate regeneration report
        if: steps.upstream.outputs.changed == 'true'
        run: |
          go run ./cmd/corpusreport \
            -previous-corpus "$RUNNER_TEMP/previous-corpus.bin.gz" \
            -corpus internal/corpus/corpus.bin.gz \
            -rebuilt-corpus "$RUNNER_TEMP/rebuilt-corpus.bin.gz" \
            -previous-conformance "$RUNNER_TEMP/previous-conformance.json" \
            -conformance testdata/scancode_conformance_exact.json \
            -previous-benchmarks "$RUNNER_TEMP/previous-benchmarks.txt" \
            -benchmarks "$RUNNER_TEMP/benchmarks.txt" \
            -output "$RUNNER_TEMP/corpus-report.md"

      - name: Check diff
        if: steps.upstream.outputs.changed == 'true'
        run: git diff --check

      - name: Open refresh pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          BRANCH: automation/refresh-corpus
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/corpus-report.md
        shell: bash
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH"
          git add CORPUS_VERSION CORPUS_SHA256 NOTICE internal/corpus/corpus.bin.gz testdata/scancode_conformance_exact.json
          if git diff --cached --quiet; then
            printf 'No corpus changes to commit\n'
            exit 0
          fi
          git commit -m "Refresh ScanCode corpus"

          gh auth setup-git
          remote_commit="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$remote_commit" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_commit" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          pull_request="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pull_request" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Refresh ScanCode corpus" \
              --body-file "$REPORT_PATH"
          else
            gh pr edit "$pull_request" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$REPORT_PATH"
          fi
